<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not found | logs</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1220;--bg2:#111a2b;--surface:#141e30;
      --cyan:#3aa6c9;--green:#3cb87a;--red:#c95a6a;
      --text:#e6edf5;--muted:#8b9bb0;--border:#243247;
      --sans:"IBM Plex Sans",system-ui,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;display:flex;flex-direction:column;
      background:var(--bg);color:var(--text);font-family:var(--sans);
      background-image:radial-gradient(ellipse 60% 40% at 80% 10%, rgba(58,166,201,.08), transparent 55%);
    }
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:18px 28px;border-bottom:1px solid var(--border);
    }
    .brand{text-decoration:none;color:var(--text)}
    .brand strong{display:block;font-size:14px}
    .brand span{font-family:var(--mono);font-size:11px;color:var(--muted)}
    .status{font-family:var(--mono);font-size:12px;color:var(--red)}
    main{
      flex:1;display:flex;align-items:center;justify-content:center;
      padding:40px 20px;
    }
    .panel{
      width:min(640px,100%);
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:8px;overflow:hidden;
    }
    .chrome{
      display:flex;align-items:center;gap:8px;
      padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);
      font-family:var(--mono);font-size:12px;color:var(--muted);
    }
    .dot{width:10px;height:10px;border-radius:50%}
    .body{padding:28px 24px}
    .code{
      font-family:var(--mono);font-size:12px;color:var(--cyan);
      letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;
    }
    h1{font-size:clamp(40px,8vw,64px);letter-spacing:-0.03em;margin-bottom:10px}
    p{color:var(--muted);margin-bottom:22px;max-width:46ch}
    .term{
      font-family:var(--mono);font-size:13px;line-height:1.7;
      background:var(--bg);border:1px solid var(--border);
      border-radius:6px;padding:14px;margin-bottom:22px;
    }
    .term .err{color:var(--red)}
    .term .ok{color:var(--green)}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:11px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;
      border:1px solid transparent;
    }
    .btn-primary{background:var(--cyan);color:#06212b}
    .btn-secondary{background:transparent;color:var(--text);border-color:var(--border)}
    .btn-secondary:hover{border-color:var(--cyan)}
    footer{
      padding:16px 28px;border-top:1px solid var(--border);
      font-family:var(--mono);font-size:11px;color:var(--muted);
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <strong>~/logs</strong>
      <span>Munagala Karthik</span>
    </a>
    <div class="status">ERROR 404</div>
  </header>

  <main>
    <div class="panel">
      <div class="chrome">
        <span class="dot" style="background:#ff5f57"></span>
        <span class="dot" style="background:#febc2e"></span>
        <span class="dot" style="background:#28c840"></span>
        <span>route-lookup — bash</span>
      </div>
      <div class="body">
        <div class="code">logs · object missing</div>
        <h1>404</h1>
        <p>That path isn’t in the index. It may have moved, been renamed, or never existed.</p>
        <div class="term">
          <div>$ curl -I <span id="path">/unknown</span></div>
          <div class="err">HTTP/2 404</div>
          <div class="ok">hint: try / or feed.xml</div>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="/">All posts</a>
          <a class="btn btn-secondary" href="https://munagalakarthik.com">Portfolio</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>logs.munagalakarthik.com</span>
    <span>status: not_found</span>
  </footer>

  <script>
    const path = location.pathname + location.search;
    const el = document.getElementById('path');
    if (el) el.textContent = path || '/unknown';
  </script>
</body>
</html>
